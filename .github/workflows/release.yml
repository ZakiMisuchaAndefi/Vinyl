name: Rilis Vinyl Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cocokkan tag dengan versi
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Tag $tag tidak cocok dengan versi package.json ($version)."
          }

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun dan terbitkan installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
