name: Rilis Vinyl

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: rilis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Release draf dibuat lebih dulu supaya kedua job build mengunggah ke satu
  # release yang sama. Tanpa ini, upload paralel electron-builder bisa membuat
  # dua release untuk tag yang sama.
  siapkan-rilis:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Buat release draf
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag sudah ada; memakai release tersebut."
          else
            gh release create "$tag" --draft --verify-tag --title "$version" --notes "Vinyl $version"
          fi

  windows:
    needs: siapkan-rilis
    runs-on: windows-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cocokkan tag dengan versi
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Tag $tag tidak cocok dengan versi package.json ($version)."
          }

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun dan terbitkan installer
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  macos:
    # Dijalankan setelah Windows supaya kedua job tidak mengunggah ke release
    # secara bersamaan.
    needs: windows
    runs-on: macos-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cocokkan tag dengan versi
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak cocok dengan versi package.json (${version})." >&2
            exit 1
          fi

      - name: Pasang dependensi
        run: npm ci

      # Langkah ini tetap berjalan, tetapi isinya dilewati bila secret
      # sertifikat belum diisi. Tanpa sertifikat, build tetap dibuat dengan
      # tanda tangan ad-hoc.
      - name: Siapkan sertifikat macOS (opsional)
        env:
          CERT_BASE64: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT_BASE64" ] || [ -z "$CERT_PASSWORD" ]; then
            echo "Sertifikat tidak disediakan; build akan ditandatangani ad-hoc."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/vinyl-signing.keychain-db"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/vinyl-cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/vinyl-cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"

      # Notarization juga opsional; tanpa kredensial Apple, electron-builder
      # melewatinya dengan peringatan.
      - name: Siapkan notarization (opsional)
        env:
          APPLE_ID_VALUE: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_VALUE: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID_VALUE" ] || [ -z "$APPLE_PASSWORD_VALUE" ] || [ -z "$APPLE_TEAM_VALUE" ]; then
            echo "Kredensial Apple tidak lengkap; notarization dilewati."
            exit 0
          fi
          echo "APPLE_ID=$APPLE_ID_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_VALUE" >> "$GITHUB_ENV"

      - name: Bangun dan terbitkan DMG
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terbitkan:
    # Release tetap draf selama build, lalu dipublikasikan setelah semua aset
    # dari Windows dan macOS selesai diunggah.
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Publikasikan release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release edit "$tag" --draft=false
          echo "Aset yang terbit:"
          gh release view "$tag" --json assets --jq '.assets[].name'
